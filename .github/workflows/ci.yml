name: Day 29 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t final-project-app:latest ./app

      - name: Run Docker Container
        run: |
          docker run -d --name final-project-test -p 5000:5000 final-project-app:latest

      - name: Test Application
        run: |
          sleep 5
          curl -f http://localhost:5000

      - name: Stop Container
        if: always()
        run: |
          docker rm -f final-project-test
